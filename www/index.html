<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strofy Store</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .app-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .app-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: white;
            transition: 0.2s;
        }
        .app-item:active {
            transform: scale(0.98);
            background: rgba(255, 255, 255, 0.08);
        }
        .app-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            object-fit: cover;
        }
        .app-details h3 {
            margin: 0 0 4px 0;
            font-size: 16px;
        }
        .app-details p {
            margin: 0;
            font-size: 12px;
            color: #888;
        }
        .get-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #4da6ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Strofy Store</h1>
    
    <!-- هنا ستظهر التطبيقات تلقائياً -->
    <div id="appContainer" class="app-list">
        <p style="text-align: center; color: #666;">جاري تحميل التطبيقات...</p>
    </div>

    <script>
        // جلب البيانات تلقائياً من ملف apps.json
        fetch('apps.json')
            .then(response => response.json())
            .then(apps => {
                const container = document.getElementById('appContainer');
                container.innerHTML = ''; // تفريغ النص المؤقت

                apps.forEach(app => {
                    // بناء رابط صفحة التفاصيل مع تمرير المعلومات ديناميكياً
                    const detailUrl = `app.html?name=${encodeURIComponent(app.name)}&ver=${encodeURIComponent(app.version)}&icon=${encodeURIComponent(app.icon)}&link=${encodeURIComponent(app.link)}&desc=${encodeURIComponent(app.desc)}`;

                    // إنشاء عنصر HTML لكل تطبيق
                    const item = document.createElement('a');
                    item.href = detailUrl;
                    item.className = 'app-item';
                    item.innerHTML = `
                        <div class="app-info">
                            <img src="${app.icon}" class="app-icon" alt="${app.name}">
                            <div class="app-details">
                                <h3>${app.name}</h3>
                                <p>الإصدار: ${app.version} | الحجم: ${app.size}</p>
                            </div>
                        </div>
                        <div class="get-btn">عرض</div>
                    `;
                    container.appendChild(item);
                });
            })
            .catch(error => {
                document.getElementById('appContainer').innerHTML = '<p style="text-align: center; color: red;">فشل تحميل التطبيقات.</p>';
            });
    </script>

</body>
</html>

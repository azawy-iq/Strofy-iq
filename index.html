<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل التطبيق</title>
    <style>
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .app-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            max-width: 350px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .app-icon {
            width: 90px;
            height: 90px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 22px;
            margin: 10px 0 5px 0;
        }
        .version {
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .description {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .download-btn {
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: bold;
            padding: 14px 0;
            width: 100%;
            display: block;
            border-radius: 50px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255,255,255,0.2);
            transition: 0.2s;
        }
        .download-btn:active {
            transform: scale(0.98);
        }
    </label>
    </style>
</head>
<body>

    <div class="app-card">
        <!-- أيقونة التطبيق -->
        <img id="appIcon" class="app-icon" src="" alt="App Icon">
        
        <!-- اسم التطبيق -->
        <h1 id="appName">اسم التطبيق</h1>
        
        <!-- الإصدار والتصنيف -->
        <div id="appVersion" class="version">الإصدار 1.0</div>
        
        <!-- وصف التطبيق -->
        <p id="appDesc" class="description">وصف مختصر يوضح مميزات التطبيق وكيفية عمله بشكل آمن وسهل.</p>
        
        <!-- زر التحميل المباشر (أو التثبيت عبر itms-services) -->
        <a id="downloadLink" href="#" class="download-btn">تنزيل التطبيق ⬇</a>
    </div>

    <script>
        // قراءة المعلومات المتغيرة من الرابط (Query Parameters) لتغيير محتوى الصفحة بحسب التطبيق الذي تم الضغط عليه
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || 'تطبيق مميز';
        const version = urlParams.get('ver') || '1.0';
        const icon = urlParams.get('icon') || 'https://via.placeholder.com/90';
        const link = urlParams.get('link') || '#';
        const desc = urlParams.get('desc') || 'استمتع بأفضل تجربة استخدام لهذا التطبيق المعدل.';

        document.getElementById('appName').innerText = name;
        document.getElementById('appVersion').innerText = "الإصدار " + version;
        document.getElementById('appIcon').src = icon;
        document.getElementById('downloadLink').href = link;
        document.getElementById('appDesc').innerText = desc;
    </script>

</body>
</html>
